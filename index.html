<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Física · 2.º</title><style>*{box-sizing:border-box}body{margin:0;background:#0a1730;color:#f3f7ff;font:17px system-ui}main{max-width:840px;margin:auto;padding:24px}.card{background:#182c4b;border:1px solid #3b587b;border-radius:17px;padding:24px;margin:14px 0}button,input,textarea{font:inherit;border-radius:9px;padding:12px}button{border:0;background:#19a58f;color:#fff;cursor:pointer;margin:5px 5px 5px 0}button:disabled{opacity:.5}.option{display:block;width:100%;text-align:left;background:#2b4769;margin:8px 0}.muted{color:#b8cce2}input,textarea{width:100%;background:white;color:#111;border:1px solid #7793b5}label{display:block;margin:10px 0}.bar{height:10px;background:#405572;border-radius:8px;overflow:hidden}.fill{height:100%;background:#36cbb2}#alert{color:#ffe5a3;font-weight:700}.ok{color:#7af1bb}.bad{color:#ffb1a9}a{color:#a8f0df}</style></head><body><main><h1>🎓 Escuela Webster</h1><p class="muted">Profesor Roberto Rico Ramírez · Repaso de octubre · Segundo parcial</p><h2>Física · 2.º</h2><section id="app" class="card"></section></main><script>const subject="Física · 2.º";const generators=[
()=>{i=ri(1,8);r=ri(2,12);return Q("Electricidad",`Una resistencia de ${r} Ω conduce ${i} A. ¿Qué voltaje hay en sus extremos (V)?`,i*r,`V=IR=${i}×${r}=${i*r} V.`,[i+r,r/i,i*r+2])},
()=>{i=ri(2,8);t=ri(3,12);return Q("Electricidad",`Una corriente de ${i} A fluye durante ${t} s. ¿Qué carga pasa (C)?`,i*t,`Q=It=${i}×${t}=${i*t} C.`,[i+t,t/i,i*t+3])},
()=>{v=ri(2,15);t=ri(2,12);return Q("Movimiento",`Un móvil avanza a ${v} m/s durante ${t} s. ¿Qué distancia recorre (m)?`,v*t,`d=vt=${v*t} m.`,[v+t,v*t/2,v*t+5])},
()=>{a=ri(2,6);t=ri(2,8);return Q("Movimiento",`Un cuerpo parte del reposo con aceleración ${a} m/s² durante ${t} s. ¿Cuál es su velocidad final (m/s)?`,a*t,`v=at=${a*t} m/s.`,[a+t,a*t*t,a*t/2])},
()=>{m=ri(2,12);return Q("Gravitación",`En la Tierra, con g≈10 m/s², ¿cuál es el peso de una masa de ${m} kg (N)?`,m*10,`P=mg=${m}×10=${m*10} N.`,[m,m+10,m*5])},
()=>{a=ri(2,12);b=ri(2,12);return Q("Circuitos",`Dos resistencias de ${a} Ω y ${b} Ω están en serie. ¿Cuál es su resistencia equivalente (Ω)?`,a+b,`En serie se suman: ${a}+${b}=${a+b} Ω.`,[a*b,Math.abs(a-b),a+b+5])},
()=>{return Q("Magnetismo","¿Qué sucede cuando se aproximan dos polos norte de imanes?","Se repelen","Polos iguales se repelen y polos opuestos se atraen.",["Se atraen","Desaparece el campo","Se neutralizan siempre"])}
];const app=document.getElementById('app');let phase='start',round=0,attempts=0,score=0,correct=0,questions=[],current=null,remaining=720,tick=null,student='',group='',log=[],away=0,awaySeconds=0,awayAt=null,finished=false,teacherUrl='https://script.google.com/a/macros/escuelawebster.org/s/AKfycbxFCrqppGnUxXglwHQ3tyLgHwB_8JEbjBsRBpm845mG0RgSxyp8kUiSzKqlM-exedgDlQ/exec',reflection='',total=12,muted=false;
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}function shuffle(a){return a.sort(()=>Math.random()-.5)}function Q(topic,prompt,answer,explanation,wrongs){let values=[String(answer),...wrongs.map(String)].filter((v,i,a)=>a.indexOf(v)===i);while(values.length<4)values.push(String(ri(10,90)));values=shuffle(values).slice(0,4);if(!values.includes(String(answer)))values[0]=String(answer);return{topic,prompt,answer:String(answer),explanation,options:shuffle(values)}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function clock(){let el=document.getElementById('clock');if(el)el.textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`;let f=document.getElementById('fill');if(f)f.style.width=(remaining/720*100)+'%'}function startTimer(){clearInterval(tick);tick=setInterval(()=>{if(phase!=='play')return;remaining=Math.max(0,remaining-1);clock();if(remaining===0){clearInterval(tick);document.getElementById('alert').textContent='Tiempo concluido. Se registrará el avance y puedes terminar sin perder tus respuestas.';document.getElementById('finishbtn').disabled=false}},1000)}function tone(){try{let ctx=new (window.AudioContext||window.webkitAudioContext)();let osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=740;gain.gain.value=.12;osc.connect(gain);gain.connect(ctx.destination);osc.start();setTimeout(()=>{osc.stop();ctx.close()},350)}catch(e){}}document.addEventListener('visibilitychange',()=>{if(phase!=='play')return;if(document.hidden){away++;awayAt=Date.now();log.push({event:'salida_de_pagina',when:new Date().toISOString()});notify('cambio_pestana');}else if(awayAt){awaySeconds+=Math.round((Date.now()-awayAt)/1000);awayAt=null;tone();let a=document.getElementById('alert');if(a)a.textContent='⚠️ Has salido de la actividad. Tu maestro recibirá aviso si está configurada la conexión.'}});window.addEventListener('blur',()=>{if(phase==='play'&&!document.hidden)tone()});
function showStart(){phase='start';app.innerHTML=`<h2>🚀 Misión de repaso</h2><p>12 retos con datos aleatorios, dos oportunidades por reactivo y explicación después de dos errores. Tiempo sugerido: 12 minutos. Al terminar, escribe lo aprendido.</p><p><strong>Atención:</strong> al cambiar de pestaña puede sonar una advertencia. Se registrará el cambio de visibilidad, pero no podemos conocer qué otra aplicación utilizas.</p><label>Nombre o clave del estudiante<input id="student" required maxlength="70"></label><label>Grupo<input id="group" maxlength="40"></label><button onclick="begin()">Comenzar</button><p class="muted">El reporte se guarda localmente. El envío al maestro requiere una dirección de Google Apps Script configurada.</p>`}
function begin(){student=document.getElementById('student').value.trim();group=document.getElementById('group').value.trim();if(!student){alert('Escribe tu nombre o clave.');return}questions=Array.from({length:total},(_,i)=>{let f=generators[i%generators.length];return f()});shuffle(questions);phase='play';round=0;remaining=720;score=0;correct=0;away=0;awaySeconds=0;log=[];render();startTimer()}
function render(){current=questions[round];attempts=0;app.innerHTML=`<div style="display:flex;justify-content:space-between"><b>Reto ${round+1} de ${total}</b><b id="clock"></b></div><div class="bar"><div class="fill" id="fill"></div></div><p class="muted">${esc(current.topic)} · Puntos: ${score}</p><h2>${esc(current.prompt)}</h2><div id="options">${current.options.map((x,i)=>`<button class="option" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${esc(x)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div><p id="alert" aria-live="assertive"></p><button id="finishbtn" onclick="endGame()">Finalizar anticipadamente</button>`;clock()}
function choose(i){if(phase!=='play')return;let selected=current.options[i],ok=selected===current.answer;attempts++;log.push({event:'respuesta',topic:current.topic,prompt:current.prompt,selected,attempt:attempts,ok,when:new Date().toISOString()});if(ok){let points=attempts===1?10:5;score+=points;correct++;resolve(`✓ Correcto. +${points} puntos. ${current.explanation}`,true)}else if(attempts>=2){resolve(`✗ Dos intentos incorrectos. 0 puntos. Solución: ${current.answer}. ${current.explanation}`,false)}else{document.getElementById('feedback').innerHTML='<p class="bad">Primera respuesta incorrecta. Puedes intentarlo una vez más.</p>';document.querySelectorAll('.option')[i].disabled=true}}
function resolve(message,ok){document.getElementById('options').innerHTML='';document.getElementById('feedback').innerHTML=`<p class="${ok?'ok':'bad'}">${esc(message)}</p><button onclick="next()">${round===total-1?'Escribir reflexión':'Siguiente reto →'}</button>`}
function next(){round++;if(round>=total)endGame();else render()}
function endGame(){if(phase!=='play')return;clearInterval(tick);phase='reflection';app.innerHTML=`<h2>✍️ Reflexión final</h2><p>Completaste ${round} de ${total} retos. Obtuviste ${score} puntos. Ahora explica con tus propias palabras qué aprendiste, qué se te dificultó y cómo lo resolverías.</p><label>Mi narración de aprendizaje<textarea id="reflection" rows="7" minlength="40" placeholder="Hoy aprendí que... Al principio me costó... Para resolverlo utilicé..."></textarea></label><p class="muted">Escribe al menos 40 caracteres. La reflexión no se califica automáticamente.</p><button onclick="submitFinal()">Entregar juego y reporte</button>`}
async function notify(event){if(!teacherUrl)return false;try{await fetch(teacherUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({event,materia:subject,student,group,score,correct,completed:round,total,away,awaySeconds,reflection,at:new Date().toISOString()})});return true}catch(e){return false}}
function submitFinal(){let r=document.getElementById('reflection').value.trim();if(r.length<40){alert('Escribe al menos 40 caracteres sobre lo aprendido.');return}reflection=r;phase='done';finished=true;notify('juego_terminado');app.innerHTML=`<h2>🏁 ¡Misión entregada!</h2><p><b>${esc(student)}</b> · ${esc(group)}</p><h2>${score} de ${total*10} puntos posibles</h2><p>Retos completados: ${round}/${total}. Resueltos: ${correct}. Cambios de visibilidad detectados: ${away}.</p><h3>Mi reflexión</h3><p style="white-space:pre-wrap">${esc(reflection)}</p><button onclick="download()">Descargar reporte CSV</button><button onclick="location.reload()">Nuevo estudiante</button><p class="muted">${teacherUrl?'Se intentó enviar el aviso al servicio configurado; comprueba su recepción en la hoja del maestro.':'No hay servicio de notificaciones configurado: entrega el CSV al maestro.'}</p>`;download()}
function download(){let data=[['materia','estudiante','grupo','evento','tema','pregunta','respuesta','intento','correcto','fecha','puntos_totales','retos_completados','cambios_visibilidad','segundos_fuera','reflexion'],...log.map(l=>[subject,student,group,l.event,l.topic||'',l.prompt||'',l.selected||'',l.attempt||'',l.ok===undefined?'':Number(l.ok),l.when,score,round,away,awaySeconds,reflection])];let csv='\ufeff'+data.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));link.download=`Reporte_${subject.replace(/[^a-z0-9]/gi,'_')}_${student.replace(/[^a-z0-9]/gi,'_')}.csv`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}showStart();</script></body></html>
